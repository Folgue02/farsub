# Pushing a v* tag (scripts/bump-version.sh, then `git push --follow-tags`) builds
# farsub for macOS, Windows and Linux with scripts/release.sh and publishes them as a
# GitHub pre-release. Run it by hand (Actions › Release › Run workflow) to only build:
# the archives are kept as the run's artifacts and nothing is published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            platform: windows
            targets: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            platform: linux
            targets: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $v"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev

      - name: Build
        shell: bash
        run: scripts/release.sh ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: farsub-${{ matrix.platform }}
          path: |
            dist/*/*.zip
            dist/*/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir files
          find out -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec mv {} files/ \;
          cd files
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.zip *.tar.gz SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "farsub ${GITHUB_REF_NAME#v}" \
            --generate-notes --verify-tag --prerelease
