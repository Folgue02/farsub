[package]
name = "farsub"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = "0.28"
fuzzy-matcher = "0.3.7"
ignore = "0.4.34"
lsp-types = "0.97"
ratatui = "0.29"
serde = "1.0.229"
serde_json = "1.0.154"
syntect = "5"
two-face = "0.5.2"
unicode-width = "0.2"
url = "2"

# Syntax highlighting is regex-heavy: keep dependencies optimized even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
