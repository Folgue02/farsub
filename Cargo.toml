[package]
name = "farsub"
version = "0.2.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3"
cc = "1.11.2"
chardetng = "0.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.37"
encoding_rs = "0.8"
flate2 = "1.1.11"
fontdb = "0.24.0"
fuzzy-matcher = "0.3.7"
globset = "0.4.21"
ignore = "0.4.34"
image = { version = "0.25", default-features = false, features = ["png"] }
libloading = "0.9.1"
lsp-types = "0.97"
lzma-rs = "0.3.0"
portable-pty = "0.9.0"
regex = "1.13.1"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Fallback regex highlighting (syntect, `.sublime-syntax` grammars) for files with no tree-sitter grammar.
syntect = "5"
tar = "0.4.46"
toml = "1"
# Checks a font has outlines before it is offered (fontdb already uses it).
ttf-parser = "0.25"
trash = "5.3.0"
tree-sitter = "0.27"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-ini = "1.4.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-language = "0.1.9"
tree-sitter-lua = "0.5.0"
tree-sitter-make = "1.1.1"
tree-sitter-md = "0.5.4"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7.2"
unicode-width = "0.2"
ureq = "2"
url = "2"
vt100 = "0.18.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
schemars = "1"

# Syntax highlighting is regex-heavy: keep dependencies optimized even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
# Smaller release binaries (panic messages are kept; backtraces lose function names).
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
# Native macOS menu bar (other platforms use the in-window menu bar).
muda = "0.21"
# Turning off macOS window tabbing (it takes Ctrl+Tab for "Show Next Tab").
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
jsonschema = { version = "0.61.2", default-features = false }

[build-dependencies]
serde_json = "1"
syntect = "5"
two-face = "0.5.2"
