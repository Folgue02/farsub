[package]
name = "farsub"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3"
chrono = "0.4.45"
eframe = "0.37"
fuzzy-matcher = "0.3.7"
ignore = "0.4.34"
lsp-types = "0.97"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = "5"
toml = "1"
trash = "5.3.0"
two-face = "0.5.2"
unicode-width = "0.2"
url = "2"

# Syntax highlighting is regex-heavy: keep dependencies optimized even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
# Native macOS menu bar (other platforms use the in-window menu bar).
muda = "0.21"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
