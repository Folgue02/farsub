name = "jdtls"
command = "jdtls"
root_markers = ["pom.xml", "build.gradle", "build.gradle.kts", "settings.gradle"]
description = "Eclipse JDT language server for Java (needs Java 21 or newer)"

# The latest build from eclipse.org, started through a launcher FarSub writes (no Python
# needed, unlike jdtls's own script). Each project gets its own workspace folder.
[install]
needs = ["java"]
needs_hint = "install a JDK 21 or newer (e.g. adoptium.net), then try again"
[install.url.assets]
all = "https://download.eclipse.org/jdtls/snapshots/jdt-language-server-latest.tar.gz"
[install.wrapper]
command = "java"
args = [
    "-Declipse.application=org.eclipse.jdt.ls.core.id1",
    "-Dosgi.bundles.defaultStartLevel=4",
    "-Declipse.product=org.eclipse.jdt.ls.core.product",
    "-Dlog.level=ALL",
    "-Xmx1G",
    "--add-modules=ALL-SYSTEM",
    "--add-opens", "java.base/java.util=ALL-UNNAMED",
    "--add-opens", "java.base/java.lang=ALL-UNNAMED",
    "-jar", "{dir}/plugins/org.eclipse.equinox.launcher_*.jar",
    "-configuration", "{dir}/config_{os}{arm}",
    "-data", "{dir}/workspaces/{root_id}",
]
