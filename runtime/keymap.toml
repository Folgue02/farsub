# Default key bindings (like Sublime's Default.sublime-keymap).
# Override or extend them in ~/.config/farsub/keymap.toml with the same format.
#
# keys:     "Cmd+Shift+P" — Cmd is Cmd on macOS and Ctrl elsewhere; also Ctrl, Shift, Alt.
# command:  a command id (see Help → Keyboard Shortcuts, or the README).
# context:  "global" (default), "editor" or "sidebar" (single letters only apply there).
# platforms: optional list, e.g. ["macos"] or ["windows", "linux"].


# ---- global
