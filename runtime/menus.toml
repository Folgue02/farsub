[[menu]]
title = "Help"
items = ["show_keymap", "show_commands", "-", "show_licenses"]

# Right-click menus.
# Shift+F10 or the Menu key opens the one for the focused pane.
[context.editor]
items = ["cut", "copy", "paste", "-", "select_all", "-", "goto_definition", "find_references", "code_actions", "rename", "hover", "format", "-", "toggle_comment", "-", "copy_file_path", "reveal_in_sidebar", "reveal_in_file_manager", "open_project_in_new_window"]

