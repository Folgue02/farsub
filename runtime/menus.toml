# Menu layout. A menus.toml in the config folder
# replaces it. Items are command ids; "-" is a separator. Labels come from the command
# names unless written as "command_id: Label".

[[menu]]
title = "File"
items = ["new_file", "new_window", "open_file", "open_folder", "reopen_closed", "-", "save", "save_as", "save_all", "-", "close_buffer", "-", "open_settings", "open_keymap", "open_config_folder", "select_theme", "select_font", "-", "quit"]

[[menu]]
title = "Edit"
items = ["undo", "redo", "-", "cut", "copy", "paste", "-", "toggle_comment", "duplicate_line", "delete_line", "move_line_up", "move_line_down", "join_lines", "insert_line_after", "insert_line_before", "-", "indent", "outdent", "sort_lines", "upper_case", "lower_case"]

[[menu]]
title = "Selection"
items = ["select_all", "select_line", "select_word", "select_all_occurrences", "-", "split_into_lines", "add_cursor_above", "add_cursor_below"]

[[menu]]
title = "Find"
items = ["find", "find_next", "find_prev", "find_all", "-", "replace", "replace_next", "replace_all", "-", "find_in_files", "next_result", "prev_result", "-", "toggle_find_regex", "toggle_find_case", "toggle_find_word", "toggle_find_wrap", "toggle_find_in_selection"]

[[menu]]
