# The VS Code colors with alpha (selection, word highlight) are flattened onto the
# background; gutter and guides are not in the original and were picked to match.
name = "Tsoding"

[editor]
background = "#181818"
foreground = "#E8E8E8"
selection = "#3D2F2F"
line_highlight = "#202020"
find_highlight = "#2D2D2D"
gutter = "#555555"
guide = "#282828"
active_guide = "#383838"
caret = "#AFADAD"

[syntax]
"comment"               = { fg = "#FF9B21" }
"comment.documentation" = { fg = "#FF9B21" }
"string"                = { fg = "#79BF46" }
"string.escape"         = { fg = "#BFC5BF" }
"character"             = { fg = "#79BF46" }
"number"                = { fg = "#BFC5BF" }
"boolean"               = { fg = "#BFC5BF" }
"constant"              = { fg = "#BFC5BF" }
"keyword"               = { fg = "#EAE2B9" }
"keyword.conditional"   = { fg = "#FFDD33" }
"keyword.repeat"        = { fg = "#FFDD33" }
"keyword.return"        = { fg = "#FFDD33" }
"keyword.exception"     = { fg = "#FFDD33" }
"keyword.coroutine"     = { fg = "#FFDD33" }
"keyword.control"       = { fg = "#FFDD33" }
"keyword.type"          = { fg = "#FFDD33" }
"keyword.operator"      = { fg = "#BFC5BF" }
"operator"              = { fg = "#BFC5BF" }
"type"                  = { fg = "#BFC5BF" }
"type.builtin"          = { fg = "#FFDD33" }
"function.macro"        = { fg = "#BFC5BF" }
"variable.parameter"    = { fg = "#E2E2E2" }
"variable.builtin"      = { fg = "#BFC5BF" }
"namespace"             = { fg = "#919191" }
"module"                = { fg = "#919191" }
"punctuation"           = { fg = "#BFC5BF" }
"embedded"              = { fg = "#BD9393" }
"markup.heading"        = { fg = "#FFDD33", bold = true }
"markup.bold"           = { bold = true }
"markup.italic"         = { italic = true }
"markup.raw"            = { fg = "#79BF46" }
"markup.link"           = { fg = "#7BA092" }
"diff.plus"             = { fg = "#79BF46" }
"diff.minus"            = { fg = "#C22121" }
"diff.delta"            = { fg = "#C2AA21" }
