"escape"                = { fg = "#FB4934" }
"embedded"              = { fg = "#FBF1C7" }
"markup.heading"        = { fg = "#B8BB26" }
"markup.bold"           = { fg = "#FE8019", bold = true }
"markup.italic"         = { fg = "#FB4934", italic = true }
"markup.strikethrough"  = { fg = "#928374", italic = true }
"markup.raw"            = { fg = "#FABD2F" }
"markup.list"           = { fg = "#83A598" }
"markup.quote"          = { fg = "#D3869B" }
"diff.plus"             = { fg = "#B8BB26" }
"diff.minus"            = { fg = "#FB4934" }
"diff.delta"            = { fg = "#FABD2F" }
