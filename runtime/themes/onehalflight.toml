# Converted from the OneHalfLight color scheme.
name = "OneHalfLight"

[editor]
background = "#FAFAFA"
foreground = "#383A42"
selection = "#BFCEFF"
line_highlight = "#F0F0F0"
gutter = "#D4D4D4"
caret = "#383A42"

