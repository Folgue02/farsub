"keyword"               = { fg = "#A626A4" }
"keyword.operator"      = { fg = "#A626A4" }
"keyword.function"      = { fg = "#A626A4" }
"keyword.storage"       = { fg = "#A626A4" }
"keyword.import"        = { fg = "#A626A4" }
"keyword.return"        = { fg = "#A626A4" }
