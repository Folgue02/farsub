# Converted from the OneHalfDark color scheme.
name = "OneHalfDark"

[editor]
background = "#282C34"
foreground = "#DCDFE4"
selection = "#474E5D"
line_highlight = "#313640"
gutter = "#919BAA"
caret = "#A3B3CC"

