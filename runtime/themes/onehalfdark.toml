"character"             = { fg = "#E5C07B" }
"number"                = { fg = "#E5C07B" }
"boolean"               = { fg = "#E5C07B" }
"constant"              = { fg = "#E06C75" }
"constant.builtin"      = { fg = "#E5C07B" }
"keyword"               = { fg = "#C678DD" }
"keyword.operator"      = { fg = "#C678DD" }
"keyword.function"      = { fg = "#C678DD" }
"keyword.storage"       = { fg = "#C678DD" }
"keyword.import"        = { fg = "#C678DD" }
"keyword.return"        = { fg = "#C678DD" }
"operator"              = { fg = "#C678DD" }
"type"                  = { fg = "#E5C07B" }
