# Converted from the Monokai Extended Bright color scheme.
name = "Monokai Extended Bright"

[editor]
background = "#272822"
foreground = "#F8F8F2"
selection = "#9D550F"
line_highlight = "#3E3D32"
active_guide = "#9D550F"
caret = "#F8F8F0"

[syntax]
"comment"               = { fg = "#75715E" }
"comment.documentation" = { fg = "#75715E" }
"string"                = { fg = "#E6DB74" }
"string.escape"         = { fg = "#AE81FF" }
"string.special"        = { fg = "#F6AA11" }
"string.regexp"         = { fg = "#F6AA11" }
"character"             = { fg = "#AE81FF" }
"number"                = { fg = "#AE81FF" }
"boolean"               = { fg = "#AE81FF" }
"constant"              = { fg = "#AE81FF" }
"constant.builtin"      = { fg = "#AE81FF" }
"keyword"               = { fg = "#F92672" }
"keyword.operator"      = { fg = "#F92672" }
"keyword.function"      = { fg = "#66D9EF", italic = true }
"keyword.storage"       = { fg = "#F92672" }
"keyword.import"        = { fg = "#F92672" }
"keyword.return"        = { fg = "#F92672" }
"operator"              = { fg = "#F92672" }
"type"                  = { fg = "#F92672" }
"type.builtin"          = { fg = "#66D9EF", italic = true }
"constructor"           = { fg = "#A6E22E" }
"function"              = { fg = "#A6E22E" }
"function.call"         = { fg = "#66D9EF" }
"function.method"       = { fg = "#A6E22E" }
"function.builtin"      = { fg = "#66D9EF" }
"function.macro"        = { fg = "#A6E22E" }
"variable.parameter"    = { fg = "#FD971F", italic = true }
"property"              = { fg = "#66D9EF", italic = true }
"attribute"             = { fg = "#A6E22E" }
"label"                 = { fg = "#F92672" }
"namespace"             = { fg = "#F92672" }
"module"                = { fg = "#F92672" }
"tag"                   = { fg = "#F92672" }
"tag.attribute"         = { fg = "#A6E22E" }
"escape"                = { fg = "#AE81FF" }
"markup.heading"        = { fg = "#FD971F" }
"markup.bold"           = { fg = "#F92672", bold = true }
"markup.italic"         = { fg = "#F92672", italic = true }
"markup.link"           = { fg = "#A6E22E", underline = true }
"markup.link.url"       = { fg = "#A6E22E", underline = true }
"markup.quote"          = { fg = "#66D9EF", italic = true }
"diff.plus"             = { fg = "#A6E22E" }
"diff.minus"            = { fg = "#F92672" }
"diff.delta"            = { fg = "#E6DB74" }
