"markup.italic"         = { fg = "#9D0006", italic = true }
"markup.strikethrough"  = { fg = "#928374", italic = true }
"markup.raw"            = { fg = "#B57614" }
"markup.list"           = { fg = "#076678" }
"markup.quote"          = { fg = "#8F3F71" }
"diff.plus"             = { fg = "#79740E" }
