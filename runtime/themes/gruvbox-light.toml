# Converted from the gruvbox-light color scheme.
name = "gruvbox-light"

[editor]
background = "#FBF1C7"
foreground = "#3C3836"
selection = "#EBDBB2"
line_highlight = "#EBDBB2"
gutter = "#928374"
guide = "#3C3836"
active_guide = "#3C3836"
caret = "#7C6F64"

[syntax]
"comment"               = { fg = "#928374", italic = true }
"comment.documentation" = { fg = "#928374", italic = true }
"string"                = { fg = "#79740E" }
"string.escape"         = { fg = "#9D0006" }
"string.special"        = { fg = "#79740E" }
"string.regexp"         = { fg = "#79740E" }
"character"             = { fg = "#8F3F71" }
"number"                = { fg = "#8F3F71" }
"boolean"               = { fg = "#8F3F71" }
"constant"              = { fg = "#B57614" }
"constant.builtin"      = { fg = "#8F3F71" }
"keyword"               = { fg = "#9D0006" }
"keyword.operator"      = { fg = "#427B58" }
"keyword.function"      = { fg = "#427B58" }
"keyword.storage"       = { fg = "#9D0006" }
"keyword.import"        = { fg = "#9D0006" }
"keyword.return"        = { fg = "#9D0006" }
"operator"              = { fg = "#427B58" }
"type"                  = { fg = "#B57614" }
