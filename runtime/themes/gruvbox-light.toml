"function.macro"        = { fg = "#79740E" }
"variable"              = { fg = "#076678" }
"variable.parameter"    = { fg = "#282828" }
"variable.builtin"      = { fg = "#8F3F71" }
"variable.member"       = { fg = "#076678" }
"property"              = { fg = "#076678" }
"attribute"             = { fg = "#B57614" }
"label"                 = { fg = "#79740E" }
"namespace"             = { fg = "#B57614" }
"module"                = { fg = "#AF3A03" }
"tag"                   = { fg = "#076678" }
