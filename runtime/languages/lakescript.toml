name = "lakescript"
title = "LakeScript"
# No tree-sitter grammar yet: highlighted by the bundled regex grammar
# (runtime/syntaxes/LakeScript.sublime-syntax).
grammar = ""
extensions = ["lks"]
# On PATH only: comes with LakeScript (cargo install --path crates/lks-lsp).
servers = ["lks_lsp"]
first_line = '^#!.*\blks\b'
comment = "//"
tab_size = 4
