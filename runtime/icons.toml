# File icons for the sidebar, tabs and Goto Anything (an icon theme).
# A user icons.toml in the config folder adds to / overrides these.
#
# Each [[icons]] entry: `label` (1–3 characters shown on a colored badge), `color` ("#RRGGBB"),
# and what it matches: exact file `names` (checked first) and/or `extensions`.
# Later entries win, so user entries override the built-ins.

folder_color = "#8FA1B3"

[default]
label = ""
color = "#7D8590"

[[icons]]
extensions = ["txt", "text", "log"]
label = "txt"
color = "#8B949E"

[[icons]]
extensions = ["rs"]
label = "rs"
color = "#DEA584"

[[icons]]
extensions = ["toml"]
label = "tml"
color = "#C9824A"

[[icons]]
names = ["Cargo.toml", "Cargo.lock"]
label = "crg"
color = "#DEA584"

[[icons]]
extensions = ["py", "pyi", "pyw"]
label = "py"
color = "#4B8BBE"

[[icons]]
extensions = ["js", "mjs", "cjs"]
label = "js"
color = "#F1E05A"

[[icons]]
